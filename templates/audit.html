{% extends 'base.html' %}{% block content %}<div class="card"><h2>Audit history</h2><p class="muted">Latest 500 events · UTC · password values are never logged</p><div class="scroll"><table><tr><th>UTC time</th><th>User</th><th>Event</th><th>Entity</th><th>Details</th></tr>{% for r in rows %}<tr><td>{{r.CreatedAt}}</td><td>{{r.Username}}</td><td>{{r.Event}}</td><td>{{r.EntityId or '—'}}</td><td class="pre">{{r.Details}}</td></tr>{% endfor %}</table></div></div>{% endblock %}
